<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Simulation</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/apps/calculator.css">
  <link rel="stylesheet" href="css/apps/notepad.css">
  <link rel="stylesheet" href="css/apps/paint.css">
  <link rel="stylesheet" href="css/apps/terminal.css">
  <link rel="stylesheet" href="css/apps/browser.css">
  <link rel="stylesheet" href="css/apps/photo.css">
  <link rel="stylesheet" href="css/apps/counter.css">
  <link rel="stylesheet" href="css/apps/ico-converter.css">
  <link rel="stylesheet" href="css/apps/qrcode.css">
  <link rel="stylesheet" href="css/apps/zenkaku.css">
  <link rel="stylesheet" href="css/apps/hepburn.css">
  <link rel="stylesheet" href="css/apps/barcode.css">
  <link rel="stylesheet" href="css/apps/stopwatch.css">
  <link rel="stylesheet" href="css/apps/settings.css">
  <link rel="stylesheet" href="css/apps/table-diff.css">
</head>

<body>

<div class="desktop">

  <!-- DESKTOP ICONS（並び順・表示/非表示は js/windows.js の WINDOW_CONFIG で管理し、JSでDIVを生成） -->
  <div class="desktop-icons" id="desktopIcons"></div>

  <!-- TASKBAR -->
  <div class="taskbar">
    <div class="start" onclick="toggleStart()">⊞</div>

    <div class="task-apps" id="taskApps"></div>

    <div class="lang" id="langBtn">EN</div>
    <div class="taskbar-icon-btn" id="fullscreenBtn" data-i18n-title="fullscreenEnter">⛶</div>
    <div class="clock" id="clock"></div>
    <div class="calendar" id="calendar"></div>
  </div>

  <!-- START MENU（中身は js/windows.js の WINDOW_CONFIG から生成） -->
  <div class="start-menu" id="startMenu"></div>

  <!-- WINDOWS（js/windows.js の WINDOW_CONFIG と各アプリの *_WINDOW_CONTENT から生成） -->
</div>

<!-- 外部ライブラリ -->
<script src="qrcode-lib.js"></script>

<!-- 共通 -->
<script src="js/i18n.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/window-manager.js"></script>
<script src="js/core/desktop.js"></script>
<script src="js/core/taskbar.js"></script>

<!-- アプリ -->
<script src="js/apps/calculator.js"></script>
<script src="js/apps/notepad.js"></script>
<script src="js/apps/paint.js"></script>
<script src="js/apps/terminal.js"></script>
<script src="js/apps/browser.js"></script>
<script src="js/apps/photo.js"></script>
<script src="js/apps/counter.js"></script>
<script src="js/apps/ico-converter.js"></script>
<script src="js/apps/qrcode.js"></script>
<script src="js/apps/zenkaku.js"></script>
<script src="js/apps/hepburn.js"></script>
<script src="js/apps/barcode.js"></script>
<script src="js/apps/stopwatch.js"></script>
<script src="js/apps/settings.js"></script>
<script src="js/apps/table-diff.js"></script>

<!-- アプリ一覧（各アプリの open 関数を参照するのでアプリより後） -->
<script src="js/windows.js"></script>
<script src="js/main.js"></script>
</body>
</html>
